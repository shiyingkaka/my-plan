<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>转型行动清单</title>
<style>
  :root{
    --paper:#FAF9F5;
    --ink:#20242C;
    --ink-soft:#5B6270;
    --line:#DDD9CF;
    --pm:#2B6777;
    --pm-bg:#EAF1F1;
    --dev:#B0562F;
    --dev-bg:#F7ECE3;
    --done:#8C9A82;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1E24; --ink:#EDEBE4; --ink-soft:#9A9FAC; --line:#33363F;
      --pm-bg:#1E2C2E; --dev-bg:#2C231C;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1E24; --ink:#EDEBE4; --ink-soft:#9A9FAC; --line:#33363F;
    --pm-bg:#1E2C2E; --dev-bg:#2C231C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{
    font-family:"Noto Serif SC","Songti SC",Georgia,serif;
    color:var(--ink);
    font-size:15px;
    line-height:1.6;
  }
  .app{max-width:820px;margin:0 auto;padding:28px 20px 80px;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;margin-bottom:22px;flex-wrap:wrap;
  }
  h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:.02em;}
  .sub{color:var(--ink-soft);font-size:13px;font-family:"PingFang SC",system-ui,sans-serif;}
  .export-btn{
    font-family:"PingFang SC",system-ui,sans-serif;
    background:var(--ink);color:var(--paper);border:none;
    padding:9px 16px;border-radius:3px;font-size:13px;cursor:pointer;
    white-space:nowrap;
  }
  .export-btn:hover{opacity:.85;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;font-family:"PingFang SC",system-ui,sans-serif;}
  .tab{
    padding:8px 14px;border-radius:3px;font-size:13px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
  }
  .tab.active.pm{background:var(--pm-bg);color:var(--pm);border-color:var(--pm);}
  .tab.active.dev{background:var(--dev-bg);color:var(--dev);border-color:var(--dev);}

  .progress-wrap{font-family:"PingFang SC",system-ui,sans-serif;font-size:12px;color:var(--ink-soft);margin-bottom:22px;}
  .progress-bar{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--pm);transition:width .3s;}
  .track.dev .progress-fill{background:var(--dev);}

  .track{display:none;}
  .track.visible{display:block;}

  .week{
    border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px;
    background:color-mix(in srgb, var(--paper) 100%, transparent);
  }
  .track.pm .week{border-left:3px solid var(--pm);}
  .track.dev .week{border-left:3px solid var(--dev);}

  .week-title{
    font-size:16px;font-weight:600;outline:none;margin-bottom:10px;
    border-bottom:1px dashed transparent;
  }
  .week-title:focus{border-bottom:1px dashed var(--line);}

  .item{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px;font-family:"PingFang SC",system-ui,sans-serif;font-size:13.5px;}
  .item input[type=checkbox]{margin-top:3px;flex-shrink:0;width:14px;height:14px;accent-color:var(--pm);}
  .track.dev .item input[type=checkbox]{accent-color:var(--dev);}
  .item .txt{flex:1;outline:none;min-width:0;}
  .item.checked .txt{color:var(--ink-soft);text-decoration:line-through;}
  .item .del{
    opacity:0;cursor:pointer;color:var(--ink-soft);font-size:15px;line-height:1;
    background:none;border:none;padding:0 3px;flex-shrink:0;
  }
  .item:hover .del{opacity:1;}

  .add-item{
    font-family:"PingFang SC",system-ui,sans-serif;font-size:12.5px;color:var(--ink-soft);
    background:none;border:none;cursor:pointer;padding:2px 0;margin-top:2px;
  }
  .add-item:hover{color:var(--ink);}

  footer.note{
    font-family:"PingFang SC",system-ui,sans-serif;font-size:11.5px;color:var(--ink-soft);
    margin-top:24px;text-align:center;
  }

  @media print{
    @page{ size:A4; margin:15mm; }
    body{background:#fff;color:#000;font-size:11.5px;}
    .export-btn,.tabs,.progress-wrap,.add-item,.del{display:none !important;}
    .track{display:block !important;margin-bottom:26px;}
    .track:before{
      content:attr(data-print-label);
      display:block;font-size:16px;font-weight:700;margin:0 0 12px;
      font-family:"Noto Serif SC",serif;
    }
    .week{break-inside:avoid;border-color:#ccc;}
    .item.checked .txt{color:#888;}
  }
  @media (max-width:480px){
    .app{padding:20px 14px 60px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>转型行动清单</h1>
      <div class="sub">AI产品经理 × 代码能力提升 · 双线并行计划</div>
    </div>
    <button class="export-btn" onclick="window.print()">导出 PDF</button>
  </header>

  <div class="tabs">
    <button class="tab active pm" data-target="pm" onclick="switchTab('pm')">产品经理路线</button>
    <button class="tab dev" data-target="dev" onclick="switchTab('dev')">代码能力提升</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <span id="progressLabel">已完成 0 / 0</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="track pm visible" id="track-pm" data-print-label="产品经理学习路线（16 周）"></div>
  <div class="track dev" id="track-dev" data-print-label="代码能力提升计划（16 周）"></div>

  <footer class="note">点击文字可直接编辑 · 内容自动保存在本设备</footer>
</div>

<script>
const DEFAULT_DATA = {
  pm: [
    {title:"第1-2周｜产品基础入门", items:[
      "精读《俞军产品方法论》，做读书笔记",
      "关注3个产品经理公众号/专栏，每天看1篇",
      "学会PRD标准结构，拆解2份优秀PRD模板"
    ]},
    {title:"第3-4周｜竞品分析实战", items:[
      "选3款AI产品做竞品分析（功能/交互/商业模式）",
      "学习AI产品关键指标（准确率之外的可用性、幻觉率等）"
    ]},
    {title:"第5-6周｜AI技术产品化知识", items:[
      "学习Prompt工程基础、RAG基本原理",
      "了解Agent类产品的设计模式",
      "用Dify/Coze跑通一个简单demo"
    ]},
    {title:"第7-10周｜核心项目：从0到1做AI产品原型", items:[
      "第7周：确定选题方向（科研效率Agent）",
      "第8周：写完整PRD（需求分析+用户画像+方案）",
      "第9周：用低代码工具搭建可演示demo",
      "第10周：内测+复盘，写设计决策文档"
    ]},
    {title:"第11-12周｜简历与故事包装", items:[
      "重写简历，ML研究经历转译为技术理解力证明",
      "准备3-5个STAR法则故事",
      "找1-2位PM朋友互评简历"
    ]},
    {title:"第13-14周｜投递与面试准备", items:[
      "筛选目标公司清单，开始投递",
      "刷产品设计题、案例分析题",
      "模拟面试2-3次"
    ]},
    {title:"第15-16周｜面试冲刺与复盘", items:[
      "根据反馈优化项目故事和简历",
      "针对拿到面试的公司做专项准备",
      "每周复盘一次进展"
    ]}
  ],
  dev: [
    {title:"第1-2周｜Python工程能力", items:[
      "补齐OOP、异常处理、装饰器等进阶语法",
      "学会Git版本管理，规范commit",
      "掌握虚拟环境与依赖管理"
    ]},
    {title:"第3-4周｜数据结构与算法入门", items:[
      "LeetCode Easy难度：数组/链表/哈希表/二叉树",
      "目标：完成50-60题（跟随《代码随想录》路线）"
    ]},
    {title:"第5-6周｜中等难度刷题", items:[
      "LeetCode Medium：动态规划/回溯/双指针/滑动窗口",
      "累计刷题量达到100-120题"
    ]},
    {title:"第7-8周｜ML工程实现能力", items:[
      "手写实现神经网络/决策树（不调库）",
      "复习过拟合、正则化、损失函数等原理题"
    ]},
    {title:"第9-10周｜完整项目一：数据处理+建模", items:[
      "Kaggle竞赛或公开数据集，走完整流程",
      "代码规范、有文档，上传GitHub"
    ]},
    {title:"第11-12周｜工程化补充", items:[
      "用FastAPI把模型封装成API接口",
      "学习Docker基础，项目容器化"
    ]},
    {title:"第13-14周｜专项复习", items:[
      "复习SQL：多表查询/窗口函数/聚合函数",
      "刷题量补到150-180题，开始限时模拟"
    ]},
    {title:"第15-16周｜模拟面试", items:[
      "模拟2-3场技术面试",
      "针对目标公司技术栈专项准备"
    ]}
  ]
};

const KEY = "transition-plan-v1";
let data;
try{
  const saved = localStorage.getItem(KEY);
  data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DATA));
}catch(e){
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
}

function uid(){ return Math.random().toString(36).slice(2,9); }

function ensureIds(track){
  data[track].forEach(w=>{
    if(!w.id) w.id = uid();
    w.items.forEach(it=>{
      if(typeof it === "string") { it = {text:it, done:false}; }
    });
    w.items = w.items.map(it => typeof it === "string" ? {text:it, done:false, id:uid()} : (it.id? it : {...it, id:uid()}));
  });
}
ensureIds('pm'); ensureIds('dev');

function render(track){
  const container = document.getElementById('track-'+track);
  container.innerHTML = "";
  data[track].forEach(week=>{
    const weekEl = document.createElement('div');
    weekEl.className = 'week';

    const titleEl = document.createElement('div');
    titleEl.className = 'week-title';
    titleEl.contentEditable = "true";
    titleEl.innerText = week.title;
    titleEl.addEventListener('input', ()=>{ week.title = titleEl.innerText; save(); });
    weekEl.appendChild(titleEl);

    week.items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'item' + (it.done ? ' checked':'');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!it.done;
      cb.addEventListener('change', ()=>{
        it.done = cb.checked;
        row.classList.toggle('checked', it.done);
        save(); updateProgress();
      });
      row.appendChild(cb);

      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.contentEditable = "true";
      txt.innerText = it.text;
      txt.addEventListener('input', ()=>{ it.text = txt.innerText; save(); });
      row.appendChild(txt);

      const del = document.createElement('button');
      del.className = 'del';
      del.innerHTML = '×';
      del.title = '删除';
      del.addEventListener('click', ()=>{
        week.items = week.items.filter(x=>x.id!==it.id);
        save(); render(track); updateProgress();
      });
      row.appendChild(del);

      weekEl.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-item';
    addBtn.innerText = '+ 添加事项';
    addBtn.addEventListener('click', ()=>{
      week.items.push({text:'新事项', done:false, id:uid()});
      save(); render(track); updateProgress();
    });
    weekEl.appendChild(addBtn);

    container.appendChild(weekEl);
  });
}

function updateProgress(){
  const activeTab = document.querySelector('.tab.active');
  const track = activeTab.dataset.target;
  const weeks = data[track];
  let total=0, done=0;
  weeks.forEach(w=>w.items.forEach(it=>{ total++; if(it.done) done++; }));
  document.getElementById('progressLabel').innerText = `已完成 ${done} / ${total}`;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
}

function switchTab(track){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.target===track));
  document.querySelectorAll('.track').forEach(t=>t.classList.toggle('visible', t.id==='track-'+track));
  updateProgress();
}

render('pm'); render('dev');
updateProgress();
</script>
</body>
</html>
